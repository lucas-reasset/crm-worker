# Stack local do save-worker: LocalStack (SQS) + a fila criada + o worker.
#
#   cd save-worker && docker compose up --build
#
# O BANCO NÃO ESTÁ AQUI, e é de propósito — mesma escolha do compose do crm-frontend, que também não
# sobe o backend. Quem é dono do Postgres é o crm-backend (`cd ../crm-backend && docker compose up`),
# porque é dele que sai o schema (BE-014); duplicá-lo aqui criaria um segundo banco "do worker" com
# migrations possivelmente atrasadas — e o worker escrevendo num schema velho falha de formas que
# parecem bug de código.
#
# Então: suba o banco lá, suba a fila aqui. A `DATABASE_URL` default aponta para o host
# (`host.docker.internal`), que é onde o Postgres do outro compose publica a porta.
#
# ⚠️ O BUILD PRECISA DO SEU AGENTE SSH (a dependência `crm-backend` é git privada, BE-076) — o
# `ssh: [default]` abaixo é o que o entrega ao buildkit. Se `ssh-add -l` estiver vazio, o build falha
# em "Repository not found". Em CI o caminho é outro (token por --secret): ver .github/workflows.
name: reasset-save-worker

services:
  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: cria a fila de retorno e a DLQ, com o redrive apontando para ela. Sai.
  #
  # A DLQ existe aqui porque ela é onde os erros PERMANENTES do desenho pousam (contrato inválido,
  # FK inexistente — SW-002/SW-011), e um dev que não a tenha localmente descobre isso em produção.
  # O `maxReceiveCount: 5` é o mesmo número a fixar no Terraform.
  fila:
    image: amazon/aws-cli:2
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    command:
      - |
        set -e
        E="--endpoint-url=http://localstack:4566"
        aws $$E sqs create-queue --queue-name fila-save-dlq >/dev/null
        ARN=$$(aws $$E sqs get-queue-attributes --queue-url http://localstack:4566/000000000000/fila-save-dlq --attribute-names QueueArn --query Attributes.QueueArn --output text)
        aws $$E sqs create-queue --queue-name fila-save \
          --attributes "{\"VisibilityTimeout\":\"300\",\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$$ARN\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}" >/dev/null
        echo "fila-save + fila-save-dlq criadas"
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      target: runner
      # Entrega o agente SSH do host ao buildkit — a dependência `crm-backend` é git privada.
      ssh:
        - default
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      # ⚠️ O DONO DO SCHEMA, não o role restrito, é o default aqui — porque em dev o objetivo é
      # rodar, e o role de dev é opt-in (`scripts/role-dev.sql`). Para exercitar o GRANT de verdade
      # — que é o que a D-068 promete —, aplique o script e troque para
      # `postgres://save_worker:save_worker_dev@host.docker.internal:5432/reasset`.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/reasset}
      DB_SCHEMA: ${DB_SCHEMA:-crm}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/fila-save
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      SQS_MAX_MESSAGES: ${SQS_MAX_MESSAGES:-10}
      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-300}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    extra_hosts:
      # Linux não resolve host.docker.internal sozinho; no Docker Desktop é redundante e inofensivo.
      - "host.docker.internal:host-gateway"
    depends_on:
      fila:
        condition: service_completed_successfully
    # Sem healthcheck: este serviço não escuta porta (SW-007). "Está vivo?" se lê no log
    # (`save_worker_iniciado`) e na profundidade da fila.
    stop_grace_period: 60s
