apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.name }}-secret
    creationPolicy: Owner
  # Mesmo prefixo do crm-backend (/crm/<ns>/<serviço>), outro segredo. O conteúdo esperado:
  #   DATABASE_URL     ⛔ a do ROLE RESTRITO `crm_worker`, não a do dono do schema (D-068/REQ-0412)
  #   SQS_QUEUE_URL       a fila de retorno do ambiente
  dataFrom:
    - extract:
        key: /crm/{{ .Values.namespace }}/{{ .Values.name }}
