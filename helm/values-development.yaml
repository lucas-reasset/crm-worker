replicas: 1

env:
  - name: LOG_LEVEL
    value: "debug"
  - name: DB_SCHEMA
    value: "crm"
  - name: DB_POOL_MAX
    value: "5"
  - name: AWS_REGION
    value: "us-east-1"
  - name: SQS_WAIT_TIME_SECONDS
    value: "20"
  - name: SQS_MAX_MESSAGES
    value: "10"
  - name: SQS_VISIBILITY_TIMEOUT
    value: "300"
